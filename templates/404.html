{% extends "base.html" %}
{% block title %}
    Page not found | SprintFlow
{% endblock %}
{% block content %}
    <div class="text-center py-5">
        <div class="display-1 fw-bold text-primary">
            404
        </div>
        <h1 class="h3">
            We couldn't find that page
        </h1>

        </p>

            Back to dashboard
        </a>
    </div>
{% endblock %}
