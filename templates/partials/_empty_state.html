<div class="empty-state text-center py-5 px-3">
    <div class="empty-state-icon mb-3">{{ icon|default:"+" }}</div>
    <h2 class="h5">{{ title|default:"Nothing here yet" }}</h2>
    <p class="text-muted mb-0">{{ message|default:"Create your first item to get started." }}</p>
    {% if action_url and action_text %}
        <a href="{{ action_url }}" class="btn btn-primary mt-3">{{ action_text }}</a>
    {% endif %}
</div>
