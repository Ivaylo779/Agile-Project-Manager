{% extends "base.html" %}
{% block title %}Delete {{ project.name }} | SprintFlow{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card border-danger"><div class="card-body p-4"><h1 class="h3">Delete project?</h1><p class="text-muted">You are about to delete <strong>{{ project.name }}</strong>. Its sprints and tasks may also be removed. This action cannot be undone.</p><form method="post">{% csrf_token %}<div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{% url 'project_detail' project.pk %}">Cancel</a><button class="btn btn-danger" type="submit">Yes, delete project</button></div></form></div></div></div></div>
{% endblock %}
