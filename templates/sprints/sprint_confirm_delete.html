{% extends "base.html" %}
{% block title %}
    Delete
    {{ sprint.name }}
    | SprintFlow
{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger">
                <div class="card-body p-4">
                    <h1 class="h3">
                        Delete sprint?
                    </h1>
                    <p class="text-muted">
                        Delete
                        <strong>
                            {{ sprint.name }}
                        </strong>
                        from
                        {{ sprint.project.name }}
                        ? Its tasks may also be removed.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" href="{% url 'sprints:detail' sprint.pk %}">
                                Cancel
                            </a>
                            <button class="btn btn-danger" type="submit">
                                Yes, delete sprint
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
