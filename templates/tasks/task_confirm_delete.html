{% extends "base.html" %}
{% block title %}Delete {{ task.title }} | SprintFlow{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card border-danger"><div class="card-body p-4"><h1 class="h3">Delete task?</h1><p class="text-muted">Are you sure you want to delete <strong>{{ task.title }}</strong>? This action cannot be undone.</p><form method="post">{% csrf_token %}<div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{% url 'task_detail' task.pk %}">Cancel</a><button class="btn btn-danger" type="submit">Yes, delete task</button></div></form></div></div></div></div>
{% endblock %}
